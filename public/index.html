<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baba Tour & Travels | CRM Login</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eff4fa;color:#172e52;font:16px system-ui}
main{background:white;padding:2rem;border-radius:1rem;border:1px solid #d5e0ee;max-width:30rem;margin:1rem}
</style>
<main>
<h1>Baba Tour &amp; Travels</h1>
<p>Sign in with your approved Google account to open the CRM.</p>
<p id="error" role="alert" hidden>Access denied or session expired. Sign in with the approved account.</p>
<div id="g_id_onload" data-client_id="679114631889-9r6mtbtm8el7t87s4e3m1aii2g0nj7gk.apps.googleusercontent.com" data-callback="signIn" data-auto_prompt="false"></div>
<div class="g_id_signin" data-type="standard"></div>
<form id="login" method="post" action="/api/dashboard"><input type="hidden" name="credential"></form>
</main>
<script>
function signIn(result) {
  const form = document.getElementById('login');
  form.elements.credential.value = result.credential;
  form.submit();
}
document.getElementById('error').hidden = !new URLSearchParams(location.search).has('login');
</script>
</html>
